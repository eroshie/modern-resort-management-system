<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Resort & Spa - Management System</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Sidebar Navigation Component -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-hotel logo-icon"></i>
                    <span class="logo-text">AURA RESORT</span>
                </div>
                <button class="sidebar-close-btn" id="sidebarCloseBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="sidebar-menu">
                <a href="#dashboard" class="nav-item active" data-route="dashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#rooms" class="nav-item" data-route="rooms">
                    <i class="fa-solid fa-door-open"></i>
                    <span>Rooms & Booking</span>
                </a>
                <a href="#guests" class="nav-item" data-route="guests">
                    <i class="fa-solid fa-users"></i>
                    <span>Guest Directory</span>
                </a>
                <a href="#staff" class="nav-item" data-route="staff">
                    <i class="fa-solid fa-id-badge"></i>
                    <span>Staff Operations</span>
                </a>
                <a href="#amenities" class="nav-item" data-route="amenities">
                    <i class="fa-solid fa-spa"></i>
                    <span>Amenities & Spa</span>
                </a>
                <a href="#billing" class="nav-item" data-route="billing">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span>Billing & Reports</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span>System Online & Synced</span>
                </div>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Top Header Component -->
            <header class="top-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="global-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" placeholder="Search guests, rooms, bookings..." id="globalSearchInput">
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-icon-btn" id="notificationBtn" title="Notifications">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge-dot"></span>
                    </button>
                    <div class="user-profile-menu">
                        <div class="avatar">AM</div>
                        <div class="user-info">
                            <span class="user-name">Alexander Manager</span>
                            <span class="user-role">General Manager</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="content-area" id="mainContent">
                <!-- Views will be dynamically injected here -->
            </main>
        </div>
    </div>

    <!-- Global Modal Container -->
    <div class="modal-overlay" id="globalModal">
        <div class="modal-container" id="modalContainer">
            <!-- Modal content injected dynamically -->
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Application Entry Point JS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
